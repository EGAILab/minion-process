[project]
name = "minion-process"
version = "0.2.0"
description = "Minion-Process: the reusable two-agent process kit and its workflow-mechanics CLI"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "hypothesis", "jsonschema>=4.18", "ruff", "mypy", "types-PyYAML"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.coverage.run]
omit = ["*/__main__.py"]

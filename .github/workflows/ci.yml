name: kit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The Owner's host is Windows, and the host-queue adapter (minion_process/hostqueue/winos.py) runs only
  # there. This job carries every gate, including the 100% coverage gate and strict mypy.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Runtime and test dependencies come from pyproject.toml, never from a list kept here (PROC-KIT-P3-R005).
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pip check
      - run: ruff check .
      - run: mypy minion_process
      - run: python -m pytest -q --cov=minion_process --cov-fail-under=100
      - run: python -m minion_process profile validate profiles/example.profile.yaml
      - run: python -m minion_process profile validate profiles/minion-agent.profile.yaml

  # Every platform-neutral test also runs on Linux; Windows-only tests skip here, so no coverage gate.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pip check
      - run: ruff check .
      - run: python -m pytest -q
      - run: python -m minion_process profile validate profiles/example.profile.yaml
      - run: python -m minion_process profile validate profiles/minion-agent.profile.yaml
